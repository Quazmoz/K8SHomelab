apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml

patches:
  # Use Cluster traffic policy for stable MetalLB announcement
  # This allows any speaker to announce the IP without strict leader election
  # Trade-off: Client source IP is not preserved (SNAT'd)
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
        annotations:
          # Pin the MetalLB LoadBalancer IP (first address of first-pool on 192.168.8.0/24)
          metallb.io/loadBalancerIPs: 192.168.8.40
      spec:
        externalTrafficPolicy: Cluster
  # Enable snippet annotations for Authentik auth integration
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      data:
        allow-snippet-annotations: "true"
        annotations-risk-level: "Critical"