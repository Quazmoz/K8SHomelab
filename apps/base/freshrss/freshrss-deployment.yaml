apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: apps
  labels:
    app: freshrss
    app.kubernetes.io/name: freshrss
    app.kubernetes.io/component: feed-reader
    app.kubernetes.io/part-of: productivity
  annotations:
    description: "Self-hosted RSS feed aggregator"
    docs: "https://freshrss.github.io/FreshRSS/"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
        app.kubernetes.io/name: freshrss
        app.kubernetes.io/component: feed-reader
    spec:
      nodeSelector:
        kubernetes.io/hostname: orangepi6plus
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: freshrss
        # PHP2Shell: FreshRSS 1.30.4 image reported with patched PHP 8.4.27.
        # Keep this digest pinned; validate the ARM64 runtime before re-enabling FreshRSS.
        image: freshrss/freshrss@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
        ports:
        - containerPort: 80
        env:
        # Cron job for auto-refresh (every 30 min)
        - name: CRON_MIN
          value: "2,32"
        # PostgreSQL connection
        - name: FRESHRSS_ENV
          value: "production"
        - name: FRESHRSS_INSTALL
          value: "--default_user admin --api_enabled"
        - name: DB_TYPE
          value: "pgsql"
        - name: DB_HOST
          value: "postgres.apps.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_BASE
          value: "freshrss"
        - name: DB_USER
          value: "freshrss"
        - name: DB_PASSWORD
          value: "freshrss123"
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: freshrss-data
          mountPath: /var/www/FreshRSS/data
        - name: feeds-opml
          mountPath: /var/www/FreshRSS/data/opml
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: freshrss-data
        persistentVolumeClaim:
          claimName: freshrss-pvc
      - name: feeds-opml
        configMap:
          name: freshrss-feeds
