apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: apps
spec:
  interval: 5m
  # This site's uplink is slow enough that pulling a new chart's images can take
  # far longer than the 5m default, which marks the release failed even though
  # the rollout eventually succeeds.
  timeout: 30m
  chart:
    spec:
      chart: prometheus
      version: "29.27.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1m
  values:
    alertmanager:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: quinn-hpprobook430g6
      persistentVolume:
        enabled: false
      persistence:
        enabled: false
    pushgateway:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: quinn-hpprobook430g6

    server:
      persistentVolume:
        enabled: true
        storageClass: "local-storage"
        size: 45Gi
        existingClaim: "prometheus-server"
      resources:
        requests:
          memory: "64Mi"
          cpu: "10m"
        limits:
          memory: "2Gi"
          cpu: "2000m"
      retention: "15d"
      nodeSelector:
        kubernetes.io/hostname: quinn-hpprobook430g6

    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: quinn-hpprobook430g6

    # §4c, §7b, §7c — MCP Security Alerting Rules
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: mcp-security
            rules:
              # §4c — High error rate from MCP servers
              - alert: MCPOHighErrorRate
                expr: |
                  sum(rate(kube_pod_container_status_restarts_total{namespace="apps", container=~"mcpo|context-forge"}[5m])) > 0.1
                for: 5m
                labels:
                  severity: warning
                  compliance: "mcp-standard-4c"
                annotations:
                  summary: "MCP server experiencing high restart rate"
                  description: "{{ $labels.container }} in {{ $labels.namespace }} has restarted {{ $value }} times in the last 5 minutes."
              # §7c — MCP server pod down
              - alert: MCPODown
                expr: |
                  kube_deployment_status_replicas_available{namespace="apps", deployment=~"mcpo|context-forge"} == 0
                for: 2m
                labels:
                  severity: critical
                  compliance: "mcp-standard-7c"
                annotations:
                  summary: "MCP server is down"
                  description: "{{ $labels.deployment }} has 0 available replicas for more than 2 minutes."
              # §7b — Pod restart spike (potential runaway)
              - alert: MCPOPodRestart
                expr: |
                  increase(kube_pod_container_status_restarts_total{namespace="apps", container=~"mcpo|context-forge"}[1h]) > 3
                for: 0m
                labels:
                  severity: warning
                  compliance: "mcp-standard-7b"
                annotations:
                  summary: "MCP pod restarting repeatedly"
                  description: "{{ $labels.container }} has restarted {{ $value }} times in the last hour."
              # §4b — Loki ingestion health check
              - alert: LokiIngestionStopped
                expr: |
                  sum(rate(loki_distributor_bytes_received_total[10m])) == 0
                for: 10m
                labels:
                  severity: critical
                  compliance: "mcp-standard-4b"
                annotations:
                  summary: "Loki is not receiving any logs"
                  description: "No log bytes ingested in the last 10 minutes. Audit trail may be broken."
              # §4c — PostgreSQL exporter down
              - alert: PostgresExporterDown
                expr: |
                  up{job="postgres-exporter"} == 0
                for: 5m
                labels:
                  severity: warning
                  compliance: "mcp-standard-4c"
                annotations:
                  summary: "PostgreSQL metrics exporter is down"
                  description: "Cannot scrape PostgreSQL metrics. Database monitoring is degraded."

    # Extra scrape configs that the chart's built-in jobs cannot express.
    extraScrapeConfigs: |
      # MetalLB (v0.16+) serves metrics over TLS with token auth on port 9120,
      # so it cannot be scraped by the plain-HTTP kubernetes-pods job (its
      # prometheus.io/scrape annotation is set to "false" for that reason).
      # Authentication is delegated via the metallb-metrics-auth-delegator
      # ClusterRole in apps/base/metallb-system/metrics-rbac.yaml. The serving
      # cert is self-signed, hence insecure_skip_verify.
      - job_name: 'metallb'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['metallb-system']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '9120'
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
