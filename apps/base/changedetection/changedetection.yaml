apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data-pvc
  namespace: apps
  labels:
    app.kubernetes.io/name: changedetection
    app.kubernetes.io/component: acquisition
    app.kubernetes.io/part-of: growth-os
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  volumeName: changedetection-local-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: apps
  labels:
    app: changedetection
    app.kubernetes.io/name: changedetection
    app.kubernetes.io/component: acquisition
    app.kubernetes.io/part-of: growth-os
  annotations:
    description: "Event-driven public page change monitoring for Growth OS"
    docs: "https://github.com/dgtlmoon/changedetection.io"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
        app.kubernetes.io/name: changedetection
        app.kubernetes.io/component: acquisition
        app.kubernetes.io/part-of: growth-os
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # upstream image has no USER directive and runs as root (uid 0).
        # runAsNonRoot cannot be set. Apply seccomp for syscall restriction.
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - oracle-wireguard
                - oracle-groupmebot
      containers:
      - name: changedetection
        # 0.60.8 multi-arch index (linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v8)
        # verified on Docker Hub 2026-09-28. HTTP fetcher only in this pass;
        # do not point watches at Playwright/Selenium/Browserless.
        image: docker.io/dgtlmoon/changedetection.io:0.60.8@sha256:34df3680db1cbffc45ac1e9c1514bc0507dd0c5b5fde47d1992fe6f14a7b40e4
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: PORT
          value: "5000"
        - name: TZ
          value: America/New_York
        - name: LOGGER_LEVEL
          value: INFO
        - name: BASE_URL
          value: http://changedetection.k8s.local
        - name: FETCH_WORKERS
          value: "2"
        - name: MINIMUM_SECONDS_RECHECK_TIME
          value: "60"
        - name: PAGE_WATCH_LIMIT
          value: "50"
        - name: LLM_FEATURES_DISABLED
          value: "true"
        - name: DISABLE_VERSION_CHECK
          value: "true"
        volumeMounts:
        - name: datastore
          mountPath: /datastore
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: datastore
        persistentVolumeClaim:
          claimName: changedetection-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
  namespace: apps
  labels:
    app: changedetection
    app.kubernetes.io/name: changedetection
    app.kubernetes.io/component: acquisition
spec:
  type: ClusterIP
  selector:
    app: changedetection
  ports:
  - name: http
    port: 5000
    targetPort: http
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changedetection
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: changedetection.k8s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: changedetection
            port:
              number: 5000
