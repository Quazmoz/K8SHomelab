apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-sandbox-api-pv
  labels:
    app.kubernetes.io/name: n8n-sandbox-service
    app.kubernetes.io/component: api
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    namespace: apps
    name: n8n-sandbox-api
  local:
    path: /mnt/k8s-data/n8n-sandbox/api
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - quinn-hpprobook430g6
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-sandbox-runner-pv
  labels:
    app.kubernetes.io/name: n8n-sandbox-service
    app.kubernetes.io/component: sysbox-runner
spec:
  capacity:
    storage: 16Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    namespace: apps
    name: docker-data-n8n-sandbox-sysbox-runner-0
  local:
    path: /mnt/k8s-data/n8n-sandbox/runner-docker
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - quinn-hpprobook430g6
