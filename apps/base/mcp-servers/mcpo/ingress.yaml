---
# Ingress for mcpo (MCP-to-OpenAPI proxy)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcpo-ingress
  namespace: apps
  labels:
    app: mcpo
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
    # NOTE: this ingress is intentionally UNAUTHENTICATED.
    # It previously carried Authentik external-auth annotations, but Authentik
    # was disabled in apps/base/kustomization.yaml, so nginx could not resolve
    # authentik.apps.svc.cluster.local, the auth subrequest returned 502 and
    # every request to mcpo.k8s.local failed with HTTP 500. Anyone on the LAN
    # can now reach mcpo, which proxies MCP servers with kubectl and Postgres
    # access. Re-add the auth-url/auth-signin annotations below if Authentik
    # is re-enabled.
spec:
  ingressClassName: nginx
  rules:
  - host: mcpo.k8s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcpo
            port:
              number: 8000
