# Apply OS private runtime: own namespace, no egress, ingress only from ingress-nginx.
# Scheduled on the HP worker so it never competes with Paperclip on orangepi6plus.
apiVersion: v1
kind: Namespace
metadata:
  name: apply-os
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: apply-os-local-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    namespace: apply-os
    name: apply-os-data
  local:
    path: /mnt/k8s-data/apply-os   # must exist, owned by 10001:10001, mode 0700, on an encrypted volume
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [quinn-hpprobook430g6]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apply-os-data
  namespace: apply-os
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-storage
  volumeName: apply-os-local-pv
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apply-os
  namespace: apply-os
  labels: {app: apply-os}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single SQLite writer
  selector:
    matchLabels: {app: apply-os}
  template:
    metadata:
      labels: {app: apply-os}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: apply-os
          image: ghcr.io/quazmoz/apply-os:0.3.0   # not yet published; see README
          env:
            - {name: APPLY_OS_PUBLIC_ORIGIN, value: "https://apply-os.k8s.local"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: apply-os-data}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: apply-os-backup
  namespace: apply-os
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: ghcr.io/quazmoz/apply-os:0.3.0
              # ponytail: same-volume online backup with 7-day rotation; add encrypted off-node copy before real data
              command: [sh, -c, 'mkdir -p /data/backups && python -m apply_os.web backup /data/backups/apply-os-$(date +%u).db']
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: apply-os-data}
---
apiVersion: v1
kind: Service
metadata:
  name: apply-os
  namespace: apply-os
spec:
  selector: {app: apply-os}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apply-os
  namespace: apply-os
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [apply-os.k8s.local]
      secretName: apply-os-tls   # prerequisite, created like paperclip-tls
  rules:
    - host: apply-os.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: apply-os, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: apply-os
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: apply-os
spec:
  podSelector:
    matchLabels: {app: apply-os}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {port: 8080, protocol: TCP}
