---
# OpenWebUI Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    # Increase timeouts for LLM streaming responses
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Upstream sends no Cache-Control, so browsers heuristically cache the app shell and,
    # after an upgrade, reload-loop on 404ing old chunk hashes. Revalidate everything
    # except the content-hashed /_app/immutable/ assets.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($uri !~ "^/_app/immutable/") {
        more_set_headers "Cache-Control: no-cache";
      }
    # Homepage integration
    gethomepage.dev/enabled: "false"
    gethomepage.dev/group: "AI & Automation"
    gethomepage.dev/name: "OpenWebUI"
    gethomepage.dev/icon: "mdi-robot-outline"
    gethomepage.dev/description: "LLM Chat Interface"
spec:
  ingressClassName: nginx
  rules:
  - host: openwebui.k8s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openwebui
            port:
              number: 8080
