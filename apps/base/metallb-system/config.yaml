apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.8.40-192.168.8.99
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: example
  namespace: metallb-system
spec:
  ipAddressPools:
  - first-pool
  # The Wi-Fi worker's ARP advertisements are not reachable from LAN clients.
  nodeSelectors:
  - matchLabels:
      kubernetes.io/hostname: orangepi6plus
  interfaces:
  - enp97s0
