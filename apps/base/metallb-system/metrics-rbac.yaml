---
# MetalLB metrics authentication delegation.
#
# As of v0.16.x MetalLB serves its metrics endpoint (port 9120, named
# "metricshttps") over TLS behind controller-runtime's
# WithAuthenticationAndAuthorization filter. That filter verifies a scraper's
# bearer token by creating a TokenReview and a SubjectAccessReview -- but
# metallb-native.yaml does not grant the speaker/controller ServiceAccounts
# permission to do so, so every scrape fails with:
#
#   Authentication failed ... tokenreviews.authentication.k8s.io is forbidden:
#   User "system:serviceaccount:metallb-system:speaker" cannot create resource
#   "tokenreviews" in API group "authentication.k8s.io" at the cluster scope
#
# This is the same delegation the built-in system:auth-delegator ClusterRole
# provides and that kube-rbac-proxy sidecars normally rely on. Without it there
# is no way to scrape MetalLB metrics at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-metrics-auth-delegator
  labels:
    app: metallb
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-metrics-auth-delegator
  labels:
    app: metallb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-metrics-auth-delegator
subjects:
  - kind: ServiceAccount
    name: speaker
    namespace: metallb-system
  - kind: ServiceAccount
    name: controller
    namespace: metallb-system
