apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The official MetalLB installation manifest
  - https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml
  # Our local configuration file
  - ./config.yaml
  # Lets MetalLB authenticate Prometheus against its HTTPS metrics endpoint
  - ./metrics-rbac.yaml

patches:
  # Exclude Oracle VMs from MetalLB speaker DaemonSet
  # They use WireGuard which doesn't support UDP memberlist gossip properly
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: speaker
        namespace: metallb-system
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    # Only run speakers on nodes with local IPs (192.168.x.x)
                    # Excludes Oracle VMs which are on WireGuard (10.49.x.x)
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                      - oracle-wireguard
                      - oracle-groupmebot  # MetalLB v0.16+ serves metrics over authenticated HTTPS on 9120, but still
  # ships prometheus.io/scrape: "true", which makes the plain-HTTP
  # kubernetes-pods job fail with "client sent an HTTP request to an HTTPS
  # server". Turn the annotation off and scrape it with the dedicated
  # 'metallb' job in apps/base/prometheus/helm-release.yaml instead.
  - patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
        value: "false"
    target:
      kind: DaemonSet
      name: speaker
      namespace: metallb-system
  - patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
        value: "false"
    target:
      kind: Deployment
      name: controller
      namespace: metallb-system
