---
# PostgreSQL Backup CronJob
# Runs daily at 2 AM, keeps last 7 backups
# Stores compressed pg_dump on the Orange Pi SSD, separate from the database node
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: apps
  labels:
    app: postgres-backup
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: data-stack
  annotations:
    description: "Daily PostgreSQL backup to the Orange Pi SSD"
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600  # 1 hour timeout
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          # The backup PV lives on the Orange Pi, separate from the database node
          nodeSelector:
            kubernetes.io/hostname: orangepi6plus
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
          - name: postgres-backup
            image: postgres:18.6
            imagePullPolicy: IfNotPresent
            env:
            - name: PGHOST
              value: "postgres.apps.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: BACKUP_DIR
              value: "/backup"
            - name: RETENTION_DAYS
              value: "7"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGOPTIONS
              value: "-c statement_timeout=900000 -c lock_timeout=60000"
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              umask 077
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="${BACKUP_DIR}/postgres_backup_${TIMESTAMP}.sql.gz"
              PARTIAL=$(mktemp "${BACKUP_DIR}/.postgres_backup.XXXXXX")
              trap 'rm -f "${PARTIAL}"' EXIT

              echo "Starting PostgreSQL backup at $(date)"
              echo "Testing database connection..."
              
              # Test connection first
              if ! pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; then
                echo "ERROR: Cannot connect to PostgreSQL at ${PGHOST}:${PGPORT}"
                exit 1
              fi
              
              echo "Backing up all databases..."
              
              # Publish only a complete archive; keep diagnostic stderr out of the SQL.
              pg_dumpall --clean --if-exists | gzip > "${PARTIAL}"
              gzip -t "${PARTIAL}"
              mv "${PARTIAL}" "${BACKUP_FILE}"
              
              echo "Backup completed successfully: ${BACKUP_FILE}"
              ls -lh "${BACKUP_FILE}"
              
              # Cleanup old backups (keep last N days)
              echo "Cleaning up backups older than ${RETENTION_DAYS} days..."
              find "${BACKUP_DIR}" -name "postgres_backup_*.sql.gz" -mtime +${RETENTION_DAYS} -delete
              
              echo "Current backups:"
              ls -lht "${BACKUP_DIR}"/postgres_backup_*.sql.gz 2>/dev/null || echo "No backups found"
              
              echo "Backup job completed at $(date)"
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc

---
# PVC for PostgreSQL backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: apps
  labels:
    app: postgres-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: slow-storage
  resources:
    requests:
      storage: 20Gi
